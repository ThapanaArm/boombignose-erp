<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoomBigNose ERP — Admin Login</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <span>🐘</span>
      <span>BoomBigNose <strong>ERP</strong></span>
    </div>
    <h2>Admin Login</h2>
    <p class="auth-sub">Sign in to access your ERP dashboard</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@boombignose.org" value="admin@boombignose.org" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" value="admin1234" required />
      </div>
      <div class="login-hint">Demo credentials are pre-filled — just click Login</div>
      <button type="submit" class="btn btn-primary btn-block">Login to Dashboard</button>
    </form>
    <a href="../index.html" class="back-link">← Back to Landing Page</a>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
